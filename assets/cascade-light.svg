<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="One AI request through the cascade: the first provider hits a rate limit, the second answers cut short, the third answers. If every model fails, a rule-based answer."><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.req{animation:req 9s cubic-bezier(.4,0,.2,1) infinite}@keyframes req{0%,25.56%{transform:translateX(0)}34.44%,48.89%{transform:translateX(240px)}57.78%,95.56%{transform:translateX(480px)}100%{transform:translateX(0)}}.m0{opacity:0;animation:m0 9s step-end infinite}@keyframes m0{0%,16.67%{opacity:0}16.78%,95.56%{opacity:1}95.67%,100%{opacity:0}}.m1{opacity:0;animation:m1 9s step-end infinite}@keyframes m1{0%,40.00%{opacity:0}40.11%,95.56%{opacity:1}95.67%,100%{opacity:0}}.m2{opacity:0;animation:m2 9s step-end infinite}@keyframes m2{0%,63.33%{opacity:0}63.44%,95.56%{opacity:1}95.67%,100%{opacity:0}}</style><rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="36" y="46" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#1f2328">AI help: one request through the cascade</text><text x="1164" y="44" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#59636e">several free-tier providers, not named</text><line x1="150" y1="128" x2="1110" y2="128" stroke="#d0d7de" stroke-width="2"/><circle cx="150" cy="128" r="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="150" y="172" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">1st provider</text><circle cx="390" cy="128" r="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="390" y="172" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">2nd provider</text><circle cx="630" cy="128" r="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="630" y="172" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">3rd provider</text><circle cx="870" cy="128" r="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="870" y="172" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">4th provider</text><circle cx="1110" cy="128" r="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="1110" y="172" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">rule-based answer</text><g class="m0"><circle cx="150" cy="128" r="13" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/><path d="M145 123 l10 10 M155 123 l-10 10" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="150" y="98" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#cf222e">rate limit hit</text></g><g class="m1"><circle cx="390" cy="128" r="13" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/><path d="M385 123 l10 10 M395 123 l-10 10" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/><text x="390" y="98" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#cf222e">answer came back cut short</text></g><g class="m2"><circle cx="630" cy="128" r="13" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><path d="M624 128 l4 4 l8 -9" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><text x="630" y="98" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a7f37">answer returned</text></g><g class="req"><circle cx="150" cy="128" r="6" fill="#6639ba"/><circle cx="150" cy="128" r="11" fill="none" stroke="#6639ba" stroke-width="1.5" opacity=".5"/></g><text x="36" y="232" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#59636e" >Every model failed? A rule-based answer, never a blank screen. A cut-short answer counts as a failure and moves on.</text></svg>
