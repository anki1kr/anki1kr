<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="The flight portfolio: the ship flies from About to Projects, lands, an astronaut plants a flag and the section opens."><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pole{transform-box:view-box;transform-origin:980px 92px;transform:scaleY(0);animation:pole 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes pole{0%,51.25%{transform:scaleY(0)}56.25%,93.75%{transform:scaleY(1)}95.00%,100%{transform:scaleY(0)}}.flag{transform-box:view-box;transform-origin:980px 56px;transform:scaleX(0);animation:flag 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes flag{0%,56.25%{transform:scaleX(0)}61.25%,93.75%{transform:scaleX(1)}95.00%,100%{transform:scaleX(0)}}.who{opacity:0;animation:who 8s step-end infinite}@keyframes who{0%,48.75%{opacity:0}48.88%,93.75%{opacity:1}93.88%,100%{opacity:0}}.cap0{opacity:1;animation:cap0 8s step-end infinite}@keyframes cap0{0%,48.75%{opacity:1}48.88%,93.75%{opacity:0}93.88%,100%{opacity:1}}.cap1{opacity:0;animation:cap1 8s step-end infinite}@keyframes cap1{0%,48.75%{opacity:0}48.88%,93.75%{opacity:1}93.88%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){.pole{transform:scaleY(1)}.flag{transform:scaleX(1)}.who,.cap1{opacity:1}.cap0{opacity:0}}</style><rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="36" y="46" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#1f2328">anki1kr.me: fly, land, read</text><text x="1164" y="44" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#59636e">Three.js, no build step</text><circle cx="300" cy="70" r="1.4" fill="#59636e" opacity=".6"/><circle cx="520" cy="50" r="1.4" fill="#59636e" opacity=".6"/><circle cx="700" cy="90" r="1.4" fill="#59636e" opacity=".6"/><circle cx="860" cy="60" r="1.4" fill="#59636e" opacity=".6"/><circle cx="1120" cy="70" r="1.4" fill="#59636e" opacity=".6"/><circle cx="420" cy="200" r="1.4" fill="#59636e" opacity=".6"/><circle cx="640" cy="215" r="1.4" fill="#59636e" opacity=".6"/><circle cx="960" cy="230" r="1.4" fill="#59636e" opacity=".6"/><circle cx="190" cy="150" r="46" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="190" y="155" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">About</text><circle cx="1010" cy="142" r="58" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="1010" y="147" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#424a53">Projects</text><path d="M190 84 C 410 38, 710 24, 934 70" fill="none" stroke="#d0d7de" stroke-dasharray="3 7"/><g><path d="M-14 -7 L10 0 L-14 7 L-8 0 Z" fill="#6639ba"/><animateMotion dur="8s" repeatCount="indefinite" rotate="auto" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.06;0.5;1" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1" path="M190 84 C 410 38, 710 24, 934 70"/></g><line class="pole" x1="980" y1="92" x2="980" y2="56" stroke="#1f2328" stroke-width="2"/><path class="flag" d="M980 56 h24 l-6 7 l6 7 h-24 z" fill="#6639ba"/><g class="who"><circle cx="996" cy="74" r="5" fill="#8250df"/><rect x="992" y="80" width="8" height="12" rx="3" fill="#8250df"/></g><text class="cap0" x="36" y="232" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#59636e">Pilot the ship between the planets named About, Skills, Projects, Education and Contact.</text><text class="cap1" x="36" y="232" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#59636e">Land, and an astronaut steps out, plants a flag, and the section opens. In a hurry? A recruiter quick-view skips the flying.</text></svg>
