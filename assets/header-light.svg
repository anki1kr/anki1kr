<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Cascadia Code, Consolas, Menlo, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ff"/>
      <stop offset="40%" stop-color="#f6d9f0"/>
      <stop offset="70%" stop-color="#f3b8cf"/>
      <stop offset="100%" stop-color="#f8c9a0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdf6ff" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#fdf6ff" stop-opacity="0.58"/>
      <stop offset="74%" stop-color="#fdf6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#sky)"/>

  <path d="M395,66 Q403,58 411,66 Q419,58 427,66" stroke="#6b3a5e" stroke-width="1.8" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M460,86 Q466,80 472,86 Q478,80 484,86" stroke="#6b3a5e" stroke-width="1.4" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- dawn sun, soft glow -->
  <circle cx="1140" cy="52" r="70" fill="url(#sunglow)"/>
  <circle cx="1140" cy="52" r="24" fill="#fef3c7" opacity="0.95"/>

  <!-- far hills -->
  <path d="M0,200 C120,178 260,190 400,182 C560,172 680,192 840,180 C980,170 1100,188 1200,178 L1200,240 L0,240 Z" fill="#a3628f" opacity="0.4"/>

  <!-- near hills, the torii stands on this ridge -->
  <path d="M0,225 C150,205 300,215 450,208 C620,200 760,218 900,206 C1000,198 1100,212 1200,204 L1200,240 L0,240 Z" fill="#3a1830" opacity="0.85"/>

  <!-- torii gate silhouette -->
  <g fill="#3a1830">
    <rect x="968" y="165" width="10" height="58" rx="2"/>
    <rect x="1058" y="165" width="10" height="58" rx="2"/>
    <rect x="948" y="158" width="144" height="10" rx="3"/>
    <rect x="955" y="170" width="130" height="6" rx="2"/>
    <rect x="968" y="195" width="100" height="8" rx="2"/>
  </g>

  <rect x="0" y="225" width="1200" height="15" fill="url(#bar)" opacity="0.14"/>

  <rect width="1200" height="240" fill="url(#scrim)"/>

  <text x="64" y="66" font-size="24" letter-spacing="8" fill="#8b5cf6">hey, i'm</text>
  <text x="58" y="162" font-size="104" font-weight="700" letter-spacing="-3" fill="#2a1330">ankit</text>
  <rect x="64" y="180" width="210" height="5" rx="2.5" fill="url(#bar)"/>
  <text x="64" y="222" font-size="30" fill="#6b5570">I build things that read, reason &amp; render</text>
</svg>
